<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100C">
<meta name="robots" content="noindex">
<title>Poker Bank · שידור חי</title>
<style>
@font-face{font-family:Heebo;font-weight:500;font-display:swap;src:url(fonts/heebo-hebrew-500-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
@font-face{font-family:Heebo;font-weight:500;font-display:swap;src:url(fonts/heebo-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Heebo;font-weight:800;font-display:swap;src:url(fonts/heebo-hebrew-800-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+20AA}
@font-face{font-family:Heebo;font-weight:800;font-display:swap;src:url(fonts/heebo-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:Frank;font-weight:900;font-display:swap;src:url(fonts/frank-ruhl-libre-latin-900-normal.woff2) format('woff2')}
:root{--gold1:#FBEFA8;--gold:#E3C04F;--gold3:#B8901F;--txt:#F5F2EA;--mut:#A9B3AE;--win:#5BE58F;--loss:#FF7D7D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#07100C;color:var(--txt);font-family:Heebo,system-ui,sans-serif;min-height:100%;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,10,8,.35),rgba(5,10,8,.92)),url(img/bg.webp) center top/cover no-repeat}
body{padding:calc(env(safe-area-inset-top) + 16px) max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(14px,env(safe-area-inset-left));max-width:560px;margin:0 auto}
.gtxt{background:linear-gradient(180deg,var(--gold1),var(--gold) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:52px;height:52px}
h1{font-family:Frank,serif;font-weight:900;font-size:30px;line-height:1;direction:ltr}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#5BE58F;box-shadow:0 0 10px #5BE58F;animation:p 1.6s infinite}
.dot.off{background:#FF9E6B;box-shadow:0 0 10px #FF9E6B}
@keyframes p{50%{opacity:.35}}
.card{background:linear-gradient(180deg,rgba(24,34,29,.92),rgba(12,18,15,.92));border:1px solid rgba(227,192,79,.28);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pot{padding:18px 20px;margin-bottom:12px}
.potrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.k{font-size:14px;color:var(--mut);letter-spacing:.06em}
.money{font-size:clamp(34px,11vw,46px);font-weight:800;line-height:1.05;white-space:nowrap}
.list>div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.list>div:last-child{border-bottom:0}
.av{width:48px;height:48px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Heebo;font-weight:800;font-size:20px;color:var(--gold1);
  background:radial-gradient(circle at 35% 30%,var(--c),#0b0b0b 90%);box-shadow:0 0 0 3px #C9A23A,0 0 0 4px #6d5313}
.nm{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mut)}
.n{font-size:28px;font-weight:800;min-width:40px;text-align:center}
.amt{font-weight:800;font-size:18px;direction:ltr;text-align:left;min-width:92px}
.win{color:var(--win)}.loss{color:var(--loss)}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--mut);margin-inline-start:6px}
.left{opacity:.6}
.flash{animation:f 1.2s ease}
@keyframes f{0%{background:rgba(227,192,79,.35)}100%{background:transparent}}
h2{font-size:15px;color:var(--mut);margin:18px 4px 8px}
.msg{text-align:center;color:var(--mut);padding:60px 20px;font-size:17px;line-height:1.6}
.tr{display:flex;justify-content:space-between;padding:12px 16px;font-size:17px;font-weight:700}
.tr b{color:var(--gold1);direction:ltr}
footer{text-align:center;color:rgba(227,192,79,.65);font-size:12px;margin-top:22px}
.champ{padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;border-color:rgba(227,192,79,.6)}
</style>
</head>
<body>
<header>
  <img src="img/logo.webp" alt="">
  <div style="flex:1"><h1 class="gtxt">Poker Bank</h1>
  <div class="live"><span class="dot" id="dot"></span><span id="st">מתחבר…</span></div></div>
</header>
<main id="m"><div class="msg">טוען את השולחן…</div></main>
<footer>צפייה בלבד · נבנה על ידי עידן בן אברהם</footer>
<script>
const DB = 'https://poker-bank-live-36384-default-rtdb.europe-west1.firebasedatabase.app';
const id = (location.hash || '').slice(1).replace(/[^A-Za-z0-9]/g, '');
const $m = document.getElementById('m'), $st = document.getElementById('st'), $dot = document.getElementById('dot');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 2 });
const money = (a, plus) => `${a < 0 ? '−' : plus && a > 0 ? '+' : ''}${nf.format(Math.abs(a) / 100)} ₪`;
const cls = (v) => (v > 0 ? 'win' : v < 0 ? 'loss' : '');
const tf = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit' });
let data = null, prev = {}, lastAt = 0, connected = false;

function render() {
  if (!data) { $m.innerHTML = '<div class="msg">הקישור הזה כבר לא פעיל.<br>בקשו מהבנקאי קישור חדש.</div>'; return; }
  const ps = data.p || [];
  if (data.st === 'closed' && data.r) {
    const top = data.r[0];
    const tr = data.mode === 'paybox'
      ? `<h2>משלמים לקבוצת הפייבוקס</h2><div class="card">${(data.pay || []).map((x) => `<div class="tr"><span>${esc(x.n)}</span><b>${money(x.a)}</b></div>`).join('')}</div>
         <h2>הקבוצה מעבירה</h2><div class="card">${(data.get || []).map((x) => `<div class="tr"><span>${esc(x.n)}</span><b>${money(x.a)}</b></div>`).join('')}</div>`
      : `<h2>מי משלם למי</h2><div class="card">${(data.tr || []).length ? data.tr.map((t) => `<div class="tr"><span>${esc(t.f)} ← ${esc(t.t)}</span><b>${money(t.a)}</b></div>`).join('') : '<div class="tr"><span>אין העברות</span></div>'}</div>`;
    $m.innerHTML = `${top && top.f > 0 ? `<div class="card champ"><div class="av" style="--c:${esc(top.c)};width:62px;height:62px;font-size:26px">${esc(top.n.charAt(0))}</div>
      <div style="flex:1"><div class="k" style="color:var(--gold)">👑 אלוף הערב</div><div class="nm" style="font-size:24px">${esc(top.n)}</div></div>
      <div class="amt win" style="font-size:26px">${money(top.f, true)}</div></div>` : ''}
      <h2>הערב נסגר · רווח והפסד</h2>
      <div class="card list">${data.r.map((r) => `<div><div class="av" style="--c:${esc(r.c)}">${esc(r.n.charAt(0))}</div><div style="flex:1" class="nm">${esc(r.n)}</div><div class="amt ${cls(r.f)}">${money(r.f, true)}</div></div>`).join('')}</div>${tr}`;
    return;
  }
  $m.innerHTML = `<div class="card pot"><div class="k">הקופה</div><div class="money gtxt">${money(data.pot || 0)}</div>
      <div class="potrow"><span class="sub">${data.e || 0} כניסות · ${ps.filter((p) => p.st !== 'left').length} משחקים</span>
      <span class="sub">התחלנו ב-${tf.format(data.s)}</span></div></div>
    <div class="card list">${ps.map((p, i) => `<div class="${p.st === 'left' ? 'left' : ''}" data-i="${i}">
      <div class="av" style="--c:${esc(p.c)}">${esc(p.n.charAt(0))}</div>
      <div style="flex:1;min-width:0"><div class="nm">${esc(p.n)}${p.st === 'left' ? '<span class="badge">יצא</span>' : ''}</div>
      <div class="sub">${money(p.e * (data.price || 0))}</div></div>
      <div class="n gtxt">${p.e}</div></div>`).join('')}</div>`;
  ps.forEach((p, i) => { if (prev[p.n] != null && prev[p.n] !== p.e) $m.querySelector(`[data-i="${i}"]`)?.classList.add('flash'); });
  prev = Object.fromEntries(ps.map((p) => [p.n, p.e]));
}

function status() {
  if (!connected) { $dot.className = 'dot off'; $st.textContent = 'מנסה להתחבר…'; return; }
  $dot.className = data?.st === 'closed' ? 'dot off' : 'dot';
  if (data?.st === 'closed') { $st.textContent = 'הערב הסתיים'; return; }
  const s = Math.round((Date.now() - (data?.t || Date.now())) / 1000);
  $st.textContent = `בשידור חי · עודכן ${s < 10 ? 'עכשיו' : s < 60 ? `לפני ${s} שניות` : `לפני ${Math.round(s / 60)} דק'`}`;
}
setInterval(status, 5000);

function apply(path, d) {
  if (path === '/') data = d;
  else {
    if (!data) data = {};
    const keys = path.split('/').filter(Boolean); let o = data;
    keys.slice(0, -1).forEach((k) => { if (!o[k]) o[k] = {}; o = o[k]; });
    const last = keys[keys.length - 1]; if (d === null) delete o[last]; else o[last] = d;
  }
  render(); status();
}

let es = null, pollT = null;
function connect() {
  if (!id || !DB.startsWith('http')) { $m.innerHTML = '<div class="msg">קישור לא תקין.</div>'; return; }
  try {
    es = new EventSource(`${DB}/live/${id}.json`);
    es.addEventListener('put', (e) => { connected = true; const j = JSON.parse(e.data); apply(j.path, j.data); });
    es.addEventListener('patch', (e) => { connected = true; const j = JSON.parse(e.data); Object.entries(j.data || {}).forEach(([k, v]) => apply((j.path === '/' ? '' : j.path) + '/' + k, v)); });
    es.addEventListener('cancel', () => { connected = true; data = null; render(); status(); });
    es.onerror = () => { connected = false; status(); if (es.readyState === 2) { es.close(); setTimeout(connect, 4000); } };
    es.onopen = () => { connected = true; status(); };
  } catch { poll(); }
}
async function poll() {
  try { const r = await fetch(`${DB}/live/${id}.json`); connected = r.ok; if (r.ok) { data = await r.json(); render(); } } catch { connected = false; }
  status(); clearTimeout(pollT); pollT = setTimeout(poll, 5000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && es?.readyState === 2) connect(); });
connect();
</script>
</body>
</html>
